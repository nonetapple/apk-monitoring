name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Разворачиваем стабильный Python 3.11
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Ставим необходимые компиляторы и утилиты
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev libssl-dev build-essential ccache git python3-dev openjdk-17-jdk unzip zip
          pip install --upgrade pip setuptools wheel
          pip install buildozer==1.5.0 cython==0.29.36 appdirs colorama jinja2 sh toml build

      # ЖЕСТКАЯ ПОДМЕНА: Стираем из видимости сервера Python 3.14
      # И перенаправляем команду "python3" строго на наше окружение 3.11
      - name: Force Python 3.11 Link
        run: |
          sudo rm -f /usr/bin/python3
          sudo ln -sf $(which python3.11) /usr/bin/python3
          python3 --version

      # Запускаем автоматическую сборку
      - name: Build Android APK
        run: |
          export ALLOW_ROOT=1
          export APP_ALLOW_ROOT=1
          buildozer android clean
          yes y | buildozer android debug
