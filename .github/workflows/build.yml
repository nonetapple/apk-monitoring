name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # 1. Разворачиваем эталонный Java SDK для Gradle
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 2. Разворачиваем эталонный Python 3.11
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Накатываем системные зависимости
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev libssl-dev build-essential ccache git python3-dev unzip zip libltdl-dev
          pip install --upgrade pip setuptools wheel
          pip install cython==0.29.36 python-for-android kivy

      # 4. Собираем APK напрямую с принудительной изоляцией путей Python 3.11
      - name: Compile Android APK
        run: |
          export P4A_hostpython3=$(which python3.11)
          p4a apk \
            --private . \
            --package=org.pcmonitor.app \
            --name="PC Monitor" \
            --version=1.0 \
            --bootstrap=sdl2 \
            --requirements=python3==3.11.9,kivy \
            --arch=arm64-v8a \
            --arch=armeabi-v7a \
            --color=always \
            --sdk-niceness=19 \
            --android-api=34
